[package]
name = "ide-plugin"
description = "WebAssembly runtime for plugins (wasmtime component model + WASI preview 2)"
edition.workspace = true
license.workspace = true

[dependencies]
ide-core.workspace = true
dunce.workspace = true
ide-extension.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
semver = "1"
url = "2"
wasmtime = { version = "50.0.1", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation", "async"] }
wasmtime-wasi = { version = "50.0.1", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
wat = "1.258"
