name: Release workspace cache
description: Restore compiled crates and content-verified Cargo source timestamps
inputs:
  scope:
    required: true
    description: Desktop, server or plugins; separates build profiles and command lines
  target:
    required: true
    description: Compilation target, including host architecture in the compatibility hash
  namespace:
    default: release-target
    description: Isolated cache family; verification must never use the release family
  generation:
    default: ""
    description: Optional save-only suffix for multiple producers in the same run
outputs:
  key:
    value: ${{ steps.keys.outputs.key }}
    description: Unique save key for this attempt
  paths:
    value: ${{ steps.keys.outputs.paths }}
    description: Compiled artifact paths and their input snapshot
  prefix:
    value: ${{ steps.keys.outputs.prefix }}
    description: Compatibility prefix without the save generation
  matched-key:
    value: ${{ steps.restore.outputs.cache-matched-key }}
    description: Restored key, including prefix hits; empty means no archive
  cache-hit:
    value: ${{ steps.restore.outputs.cache-hit }}
    description: True only on an exact immutable key hit
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - id: keys
      shell: bash
      env:
        CACHE_SCOPE: ${{ inputs.scope }}
        CACHE_TARGET: ${{ inputs.target }}
        CACHE_NAMESPACE: ${{ inputs.namespace }}
        CACHE_GENERATION: ${{ inputs.generation }}
      run: python3 scripts/release-cache.py keys --scope "$CACHE_SCOPE" --target "$CACHE_TARGET" --namespace "$CACHE_NAMESPACE" --generation "$CACHE_GENERATION"
    - id: restore
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.keys.outputs.paths }}
        key: ${{ steps.keys.outputs.key }}
        restore-keys: ${{ steps.keys.outputs.prefix }}
    - shell: bash
      run: python3 scripts/release-cache.py restore
