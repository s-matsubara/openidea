name: Dependency-warm cache control
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/verify-release-cache.yml
      - scripts/dependency-warm-control*

permissions:
  contents: read

concurrency:
  group: dependency-warm-control-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: never
  BUILD_TARGET: x86_64-unknown-linux-gnu
  BASE_VERSION: "2026.2.12"
  BASE_IMAGE: "20261111.370.1"

jobs:
  request:
    if: github.repository == 's-matsubara/openidea' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'perf/release-workspace-cache'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.request.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: request
        name: Measure only an explicitly marked commit, never a report-only follow-up
        run: |
          if git log -1 --format=%B | grep -Fxq 'Cache-Control: dependency-warm-v1'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

  control:
    needs: request
    if: needs.request.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Keep the controller outside both measured checkouts
        run: cp scripts/dependency-warm-control.py "$RUNNER_TEMP/dependency-warm-control.py"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # seed's stable action
        with:
          toolchain: 1.99.1
          targets: ${{ env.BUILD_TARGET }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - name: Empty the first checkout and Cargo downloaded sources
        run: python3 "$RUNNER_TEMP/dependency-warm-control.py" reset dependency-only
      - uses: actions/checkout@v7
        with:
          ref: f80a5c9f9b2de1aeaba6b9b5588b6068e76f7245
          persist-credentials: false
      - name: Prepare identical app-only release and require seed compatibility
        id: first
        run: python3 "$RUNNER_TEMP/dependency-warm-control.py" prepare dependency-only
      - name: Require the immutable workspace seed before either build
        id: seed
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.first.outputs.paths }}
          key: ${{ steps.first.outputs.seed-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - id: dependencies_first
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # seed's v2 action
        with: &dependencies
          prefix-key: verify-release-dependencies-v1
          shared-key: server-43520576305-1
          env-vars: "ImageOS ImageVersion SDKROOT MACOSX_DEPLOYMENT_TARGET"
          cache-workspace-crates: false
          save-if: "false"
      - name: Require exact dependency hit and no internal artifacts
        env:
          DEPENDENCY_HIT: ${{ steps.dependencies_first.outputs.cache-hit }}
        run: python3 "$RUNNER_TEMP/dependency-warm-control.py" dependency-check dependency-only
      - name: Measure dependency-only build
        run: python3 "$RUNNER_TEMP/dependency-warm-control.py" build dependency-only
      - name: Remove the first build and all checkout files, including source mtimes
        run: python3 "$RUNNER_TEMP/dependency-warm-control.py" reset workspace-warm
      - uses: actions/checkout@v7
        with:
          ref: f80a5c9f9b2de1aeaba6b9b5588b6068e76f7245
          persist-credentials: false
      - name: Prepare the same app-only release from a new checkout
        run: python3 "$RUNNER_TEMP/dependency-warm-control.py" prepare workspace-warm
      - id: dependencies_second
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # seed's v2 action
        with: *dependencies
      - name: Require identical restored dependency target and fresh source mtimes
        env:
          DEPENDENCY_HIT: ${{ steps.dependencies_second.outputs.cache-hit }}
        run: python3 "$RUNNER_TEMP/dependency-warm-control.py" dependency-check workspace-warm
      - id: workspace
        uses: ./.github/actions/release-cache
        with:
          scope: server-validation
          target: ${{ env.BUILD_TARGET }}
          namespace: verify-release-target-43520576305-1
          generation: control
      - name: Measure workspace-warm build from the exact seed generation
        env:
          ACTUAL_PREFIX: ${{ steps.workspace.outputs.prefix }}
          MATCHED_KEY: ${{ steps.workspace.outputs.matched-key }}
        run: python3 "$RUNNER_TEMP/dependency-warm-control.py" build workspace-warm
      - name: Require equal versions and library sets; report the measured difference
        run: python3 "$RUNNER_TEMP/dependency-warm-control.py" compare
      - name: Upload only public JSON measurements and raw Cargo messages
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-warm-control
          path: ${{ runner.temp }}/dependency-warm-control/
          retention-days: 7
          if-no-files-found: error
