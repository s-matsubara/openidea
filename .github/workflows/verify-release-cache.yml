name: Verify release cache
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/verify-release-cache.yml
      - .github/actions/release-cache/**
      - scripts/*release-cache*
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json

permissions:
  contents: read

concurrency:
  group: verify-release-cache-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: never
  BUILD_TARGET: x86_64-unknown-linux-gnu
  CACHE_NAMESPACE: verify-release-target-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  cold:
    if: github.repository == 's-matsubara/openidea' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'perf/release-workspace-cache'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PHASE: cold
      EXPECTED_PREFIX: ""
      EXPECTED_KEY: ""
      BASE_VERSION: ""
      BASE_IMAGE: ""
    outputs:
      prefix: ${{ steps.workspace.outputs.prefix }}
      key: ${{ steps.workspace.outputs.key }}
      version: ${{ steps.prepare.outputs.version }}
      image: ${{ steps.prepare.outputs.image }}
    steps: &measurement
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ env.BUILD_TARGET }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - id: prepare
        name: Check image and versions; warm changes only the application release
        run: python3 scripts/verify-release-cache.py prepare
      - id: dependency
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: verify-release-dependencies-v1
          shared-key: server-${{ github.run_id }}-${{ github.run_attempt }}
          env-vars: "ImageOS ImageVersion SDKROOT MACOSX_DEPLOYMENT_TARGET"
          cache-workspace-crates: false
      - id: workspace
        uses: ./.github/actions/release-cache
        with:
          scope: server-validation
          target: ${{ env.BUILD_TARGET }}
          namespace: ${{ env.CACHE_NAMESPACE }}
          generation: ${{ env.PHASE }}
      - name: Require cold miss or compatible cold-generation restore
        env:
          ACTUAL_PREFIX: ${{ steps.workspace.outputs.prefix }}
          MATCHED_KEY: ${{ steps.workspace.outputs.matched-key }}
          DEPENDENCY_HIT: ${{ steps.dependency.outputs.cache-hit }}
        run: python3 scripts/verify-release-cache.py restore-check
      - name: Measure real Thin LTO server build and require the current version
        run: python3 scripts/verify-release-cache.py build
      - name: Add excluded distribution canaries and snapshot inputs
        run: |
          mkdir -p target/${BUILD_TARGET}/release/bundle/cache-verification
          printf 'not a distribution signature\n' > target/${BUILD_TARGET}/release/bundle/cache-verification/installer.sig
          printf 'not a desktop binary\n' > target/${BUILD_TARGET}/release/openidea
          python3 scripts/release-cache.py capture
      - name: Verify the exact private archive selection
        env:
          CACHE_PATHS: ${{ steps.workspace.outputs.paths }}
          CACHE_PATHS_FILE: ${{ runner.temp }}/cache-paths.txt
        run: |
          printf '%s\n' "$CACHE_PATHS" > "$CACHE_PATHS_FILE"
          python3 scripts/verify-release-cache.py inventory
      - name: Save this generation before the dependency post-job cleanup
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.workspace.outputs.paths }}
          key: ${{ steps.workspace.outputs.key }}
      - name: Keep the input snapshot out of the dependency archive
        run: rm -f target/.release-inputs.json
      - name: Upload public measurement reports, never executables
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cache-verification-${{ env.PHASE }}
          path: ${{ runner.temp }}/cache-report/
          retention-days: 7
          if-no-files-found: error

  warm:
    if: github.repository == 's-matsubara/openidea' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'perf/release-workspace-cache'
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PHASE: warm
      EXPECTED_PREFIX: ${{ needs.cold.outputs.prefix }}
      EXPECTED_KEY: ${{ needs.cold.outputs.key }}
      BASE_VERSION: ${{ needs.cold.outputs.version }}
      BASE_IMAGE: ${{ needs.cold.outputs.image }}
    steps: *measurement
