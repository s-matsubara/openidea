name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing fork tag to release (vYYYY.x.x), reachable from main"
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag }}
  # https://github.com/l0ng-ai/openidea/releases/download/v0.1.49/plugins-index.json
  OPENIDEA_OFFICIAL_PLUGIN_KEYS: qeQbOdlTC+YSrUxSSSQZf8zGOmlA8nEBKRY15nPKN04=

jobs:
  # Only this run may resume its draft. A separate dispatch must use a new tag.
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.target.outputs.sha }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - id: target
        name: Validate main dispatch and resolve target tag
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "workflow_dispatch" || context.ref !== "refs/heads/main" ||
                `${context.repo.owner}/${context.repo.repo}` !== "s-matsubara/openidea")
              throw new Error("Release must be dispatched from s-matsubara/openidea main");
            const tag = process.env.TAG;
            if (!/^v[0-9]{4}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag ?? ""))
              throw new Error("Expected an explicit fork tag: vYYYY.x.x");
            const { owner, repo } = context.repo;
            let { data: { object } } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            for (let depth = 0; object.type === "tag" && depth < 8; depth++) {
              ({ data: { object } } = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha }));
            }
            if (object.type !== "commit" || !/^[0-9a-f]{40}$/.test(object.sha))
              throw new Error("Tag must resolve to a commit");
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${object.sha}...main`,
            });
            if (comparison.merge_base_commit.sha !== object.sha)
              throw new Error("Target tag must be reachable from main");
            core.setOutput("sha", object.sha);
      - uses: actions/checkout@v7
        with: { ref: "${{ steps.target.outputs.sha }}" }
      - name: Tag matches app versions
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          tag = os.environ["TAG"]
          versions = [json.load(open(p))["version"] for p in ["package.json", "src-tauri/tauri.conf.json"]]
          versions.append(tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"])
          if any(f"v{version}" != tag for version in versions):
              raise SystemExit(f"Tag {tag} does not match app versions: {versions}")
          PY
      # A shipped plugin API is frozen: its WIT must be the snapshot api_frozen.rs checks later
      # versions against (plugins/README.md, "Evolving the plugin API").
      - name: Plugin API snapshot matches wit/
        run: |
          api() { sed -n 's/^package openidea:plugin@\(.*\);$/\1/p' "$1/plugin.wit"; }
          snapshot=sdk/rust/openidea-plugin/tests/api/released
          if [ "$(api wit)" != "$(api "$snapshot")" ]; then
            echo "::error::plugin API $(api wit) ships without a snapshot ($snapshot is $(api "$snapshot")): copy wit/*.wit to $snapshot/"
            exit 1
          fi
      - id: release
        uses: actions/github-script@v9
        env:
          COMMIT_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            const marker = `<!-- openidea-release:${context.runId}:${process.env.COMMIT_SHA} -->`;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              if (!existing.draft || !existing.body?.includes(marker))
                throw new Error(`Release ${tag} is published or belongs to another run; do not redispatch it`);
              core.setOutput("id", existing.id);
              return;
            }
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `OpenIDEA ${tag}`,
              target_commitish: process.env.COMMIT_SHA,
              draft: true, prerelease: false, generate_release_notes: true, body: marker,
            });
            core.setOutput("id", data.id);

  build:
    needs: create-release
    name: Build (${{ matrix.name }})
    env:
      # Keep desktop builds on the Thin LTO profile used by upstream.
      CARGO_PROFILE_RELEASE_LTO: thin
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # - name: macOS x64
          #   os: macos-latest
          #   target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # - name: Linux arm64
          #   os: ubuntu-22.04-arm
          #   target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - &owned-draft
        name: Require this run's unpublished release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          COMMIT_SHA: ${{ needs.create-release.outputs.commit_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const sha = process.env.COMMIT_SHA;
            const marker = `<!-- openidea-release:${context.runId}:${sha} -->`;
            const { data: release } = await github.rest.repos.getRelease({
              owner, repo, release_id: Number(process.env.RELEASE_ID),
            });
            if (!release.draft || release.tag_name !== tag || !release.body?.includes(marker))
              throw new Error("Refusing to modify a published, unrelated or foreign-run release");
            let { data: { object } } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            for (let depth = 0; object.type === "tag" && depth < 8; depth++) {
              ({ data: { object } } = await github.rest.git.getTag({ owner, repo, tag_sha: object.sha }));
            }
            if (object.type !== "commit" || object.sha !== sha)
              throw new Error("Target tag moved since validation; refusing to continue");
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.create-release.outputs.commit_sha }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 22.23.4, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with:
          key: "${{ matrix.target }}"
          env-vars: "ImageOS ImageVersion SDKROOT MACOSX_DEPLOYMENT_TARGET OPENIDEA_OFFICIAL_PLUGIN_KEYS"
      - id: workspace-cache
        uses: ./.github/actions/release-cache
        with: { scope: desktop, target: "${{ matrix.target }}" }
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: pnpm install --frozen-lockfile
      # Tauri signs both macOS bundles here. Notary and updater credentials
      # are supplied only to the later macOS job.
      - name: Build and code-sign macOS bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Missing Developer ID certificate}"
          : "${APPLE_SIGNING_IDENTITY:?Missing Developer ID signing identity}"
          pnpm tauri build --target "$TARGET" --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
          bundle="target/$TARGET/release/bundle"
          app="$bundle/macos/OpenIDEA.app"
          developer_id='anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists'
          codesign --verify --deep --strict "$app"
          codesign --verify -R "$developer_id" "$app"
          mkdir -p "$RUNNER_TEMP/macos-release"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/macos-release/OpenIDEA.app.zip"
          for dmg in "$bundle"/dmg/*.dmg; do
            codesign --verify -R "$developer_id" "$dmg"
            cp "$dmg" "$RUNNER_TEMP/macos-release/"
          done
      - name: Save signed macOS bundles for notarization
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: macos-release-${{ matrix.target }}
          path: ${{ runner.temp }}/macos-release/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Export updater signing credentials when configured
        if: runner.os != 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for var in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -n "${!var}" ]]; then
              printf '%s<<__EOF__\n%s\n__EOF__\n' "$var" "${!var}" >> "$GITHUB_ENV"
            fi
          done
      - uses: tauri-apps/tauri-action@v0
        if: runner.os != 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ env.TAG }}
          args: --target ${{ matrix.target }}
          uploadUpdaterJson: false
      # Portable Windows builds (#1857): on Windows Tauri embeds the
      # frontend in the exe and WebView2 is a system component, so zipping
      # the raw exe gives an unpack-and-run alternative to the installers.
      - name: Portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $target = "${{ matrix.target }}"
          $arch = if ($target -like "x86_64*") { "x64" } else { "arm64" }
          $version = $env:TAG -replace '^v', ''
          $asset = "OpenIDEA_${version}_windows_${arch}_portable.zip"
          $dir = "target/$target/release"
          $files = @("$dir/openidea.exe")
          if (Test-Path "$dir/WebView2Loader.dll") {
            $files += "$dir/WebView2Loader.dll"
          }
          Compress-Archive -Path $files -DestinationPath $asset -Force
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "$asset.sha256"
          gh release upload $env:TAG $asset "$asset.sha256" --clobber
      - name: Snapshot compiled workspace inputs
        run: python3 scripts/release-cache.py capture
      - uses: actions/cache/save@v5
        with:
          path: ${{ steps.workspace-cache.outputs.paths }}
          key: ${{ steps.workspace-cache.outputs.key }}
      - name: Remove dependency-cache snapshot
        run: rm -f target/.release-inputs.json

  notarize-macos:
    needs: [create-release, build]
    name: Notarize macOS bundles
    runs-on: macos-latest
    steps:
      - *owned-draft
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.create-release.outputs.commit_sha }}" }
      - uses: pnpm/action-setup@v6
        with: { version: 11 }
      - uses: actions/setup-node@v7
        with: { node-version: 22.23.4, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          pattern: macos-release-*
          path: ${{ runner.temp }}/notarization
          merge-multiple: false
      - name: Notarize, staple and upload
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing Apple ID}"
          : "${APPLE_PASSWORD:?Missing Apple app-specific password}"
          : "${APPLE_TEAM_ID:?Missing Apple team ID}"

          notarize() {
            local result
            if ! result=$(xcrun notarytool submit "$1" --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json) ||
              ! jq -e '.status == "Accepted"' <<< "$result" >/dev/null; then
              printf '%s\n' "$result"
              return 1
            fi
          }

          notarized_assets=()
          version="${TAG#v}"
          # download-artifact extracts a single match directly into the destination.
          shopt -s nullglob
          root="$RUNNER_TEMP/notarization"
          images=("$root"/OpenIDEA_"${version}"_*.dmg "$root"/macos-release-*/OpenIDEA_"${version}"_*.dmg)
          if (( ${#images[@]} == 0 )); then
            echo "::error::Missing macOS build artifact"
            exit 1
          fi
          for dmg in "${images[@]}"; do
            dir="${dmg%/*}"
            arch="${dmg##*_}"
            arch="${arch%.dmg}"
            app="$dir/OpenIDEA.app"
            zip="$app.zip"
            test -f "$zip" || { echo "::error::Incomplete macOS build artifact"; exit 1; }

            notarize "$zip"
            ditto -x -k "$zip" "$dir"
            xcrun stapler staple "$app"
            xcrun stapler validate "$app"

            notarize "$dmg"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            notarized_assets+=("$dmg")

            if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
              archive="$dir/OpenIDEA_${arch}.app.tar.gz"
              COPYFILE_DISABLE=1 tar -czf "$archive" -C "$dir" OpenIDEA.app
              pnpm tauri signer sign --app-version "$version" "$archive"
              notarized_assets+=("$archive" "$archive.sig")
            fi
          done
          gh release upload "$TAG" "${notarized_assets[@]}" --clobber

  # The remote development server, per host platform it can run on. The desktop
  # app downloads the one for the host (ide-tools `server`) and installs it over SSH.
  # Linux builds are static (musl), so they run whatever the host's glibc.
  server:
    needs: create-release
    name: Server (${{ matrix.os }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-musl, os: linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, os: linux, arch: aarch64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, os: macos, arch: aarch64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, os: macos, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - *owned-draft
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.create-release.outputs.commit_sha }}" }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with:
          key: "server-${{ matrix.target }}"
          env-vars: "ImageOS ImageVersion SDKROOT MACOSX_DEPLOYMENT_TARGET"
      - id: workspace-cache
        uses: ./.github/actions/release-cache
        with: { scope: server, target: "${{ matrix.target }}" }
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: |
          # musl-tools only ships `musl-gcc`; cc-rs would look for `<arch>-linux-musl-gcc`.
          if [ "$RUNNER_OS" = Linux ]; then export CC_${TARGET//-/_}=musl-gcc; fi
          cargo build --release --locked -p ide-host --bin openidea-server --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: openidea-server-${{ matrix.os }}-${{ matrix.arch }}.gz
        run: |
          gzip -9 -c target/${{ matrix.target }}/release/openidea-server > "$ASSET"
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET"; else shasum -a 256 "$ASSET"; fi > "$ASSET.sha256"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
      - name: Snapshot compiled workspace inputs
        run: python3 scripts/release-cache.py capture
      - uses: actions/cache/save@v5
        with:
          path: ${{ steps.workspace-cache.outputs.paths }}
          key: ${{ steps.workspace-cache.outputs.key }}
      - name: Remove dependency-cache snapshot
        run: rm -f target/.release-inputs.json

